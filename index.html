<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DSA Pattern Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1218; --panel:#171B23; --panel2:#1D222C; --border:#282E3A;
  --text:#E7E9EE; --dim:#8A93A6; --dim2:#5E6678;
  --accent:#7DD3FC; --accent-dim:#3A5A70;
  --easy:#34D399; --med:#FBBF24; --hard:#FB7185;
  --font-sans:'Inter',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F7F7F5; --panel:#FFFFFF; --panel2:#F0F0EE; --border:#E2E1DC;
    --text:#1B1D22; --dim:#6B7280; --dim2:#9CA3AF;
    --accent-dim:#CFE9F7;
  }
}
:root[data-theme="dark"]{ --bg:#0F1218; }
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--bg); color:var(--text); font-family:var(--font-sans);
  -webkit-font-smoothing:antialiased; min-height:100%;
}
.wrap{max-width:760px; margin:0 auto; padding:0 20px 80px;}

/* header */
header{
  position:sticky; top:0; z-index:10;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  padding:env(safe-area-inset-top,0px) 0 0;
}
.hd-inner{max-width:760px; margin:0 auto; padding:18px 20px 14px;}
.hd-top{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap;}
h1{font-size:19px; font-weight:700; margin:0; letter-spacing:-0.01em;}
.hd-count{font-family:var(--font-mono); font-size:13px; color:var(--dim); white-space:nowrap;}
.hd-count b{color:var(--accent); font-weight:600;}

.bar{height:6px; border-radius:99px; background:var(--panel2); overflow:hidden; margin-top:10px;}
.bar-fill{height:100%; background:linear-gradient(90deg,var(--accent),#a8e6fc); width:0%; transition:width .4s ease;}

.controls{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; align-items:center;}
.search{
  flex:1; min-width:140px; background:var(--panel); border:1px solid var(--border);
  color:var(--text); border-radius:8px; padding:8px 12px; font-size:13px; font-family:var(--font-sans);
}
.search:focus{outline:2px solid var(--accent); outline-offset:-1px;}
.chip{
  background:var(--panel); border:1px solid var(--border); color:var(--dim);
  font-size:12px; font-family:var(--font-mono); padding:7px 11px; border-radius:8px; cursor:pointer;
  user-select:none;
}
.chip[data-active="1"]{color:var(--bg); background:var(--accent); border-color:var(--accent); font-weight:600;}
.chip:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

/* nav */
.nav{display:flex; gap:6px; margin-top:12px; overflow-x:auto;}
.nav a{
  font-size:12px; color:var(--dim); text-decoration:none; padding:6px 10px;
  border:1px solid var(--border); border-radius:99px; white-space:nowrap; font-family:var(--font-mono);
}
.nav a:hover{color:var(--text); border-color:var(--dim2);}

/* pattern section */
.pattern{margin-top:34px;}
.p-head{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.p-title{font-size:16px; font-weight:700; margin:0; scroll-margin-top:150px;}
.p-sub{font-family:var(--font-mono); font-size:12px; color:var(--dim);}
.p-bar{margin-top:8px;}
.p-actions{display:flex; gap:6px; margin-top:10px;}
.linklike{
  background:none; border:none; color:var(--dim); font-size:12px; font-family:var(--font-mono);
  cursor:pointer; padding:4px 0; text-decoration:underline; text-underline-offset:2px;
}
.linklike:hover{color:var(--accent);}

/* phase */
.phase{margin-top:14px; border:1px solid var(--border); border-radius:12px; overflow:hidden; background:var(--panel);}
.phase-hd{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:12px 14px; cursor:pointer; user-select:none;
}
.phase-hd:hover{background:var(--panel2);}
.phase-hd-left{display:flex; align-items:center; gap:10px; min-width:0;}
.chevron{color:var(--dim2); font-size:11px; transition:transform .2s ease; flex:none;}
.phase[data-open="1"] .chevron{transform:rotate(90deg);}
.phase-name{font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.phase-meta{display:flex; align-items:center; gap:8px; flex:none;}
.phase-count{font-family:var(--font-mono); font-size:11px; color:var(--dim2);}
.mini-bar{width:46px; height:4px; border-radius:99px; background:var(--panel2); overflow:hidden;}
.mini-fill{height:100%; background:var(--accent);}

.rows{display:none; border-top:1px solid var(--border);}
.phase[data-open="1"] .rows{display:block;}

.row{
  display:flex; align-items:flex-start; gap:10px; padding:10px 14px;
  border-top:1px solid var(--border);
}
.row:first-child{border-top:none;}
.row[data-hidden="1"]{display:none;}
.row.done .row-title{color:var(--dim); text-decoration:line-through; text-decoration-color:var(--dim2);}

.cb{
  appearance:none; width:17px; height:17px; border-radius:5px; border:1.5px solid var(--dim2);
  background:transparent; flex:none; margin-top:2px; cursor:pointer; position:relative;
}
.cb:checked{background:var(--accent); border-color:var(--accent);}
.cb:checked::after{
  content:""; position:absolute; left:5px; top:1px; width:4px; height:8px;
  border:solid var(--bg); border-width:0 2px 2px 0; transform:rotate(45deg);
}
.cb:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

.row-body{flex:1; min-width:0;}
.row-line{display:flex; align-items:baseline; gap:7px; flex-wrap:wrap;}
.dot{width:8px; height:8px; border-radius:50%; flex:none;}
.dot.E{background:var(--easy);} .dot.M{background:var(--med);} .dot.H{background:var(--hard);}
.row-num{font-family:var(--font-mono); font-size:12px; color:var(--dim);}
.row-title{font-size:14px; font-weight:500;}
.row-title a{color:inherit; text-decoration:none;}
.row-title a:hover{color:var(--accent);}
.row-meta{display:flex; align-items:center; gap:6px; margin-top:4px; flex-wrap:wrap;}
.tag{
  font-size:10.5px; font-family:var(--font-mono); color:var(--dim); background:var(--panel2);
  border:1px solid var(--border); padding:2px 7px; border-radius:99px;
}
.stars{color:var(--med); font-size:11px; letter-spacing:1px;}
.repeat{
  font-size:10.5px; color:var(--dim); display:inline-flex; align-items:center; gap:3px;
}

footer{max-width:760px; margin:40px auto 0; padding:0 20px; text-align:center; color:var(--dim2); font-size:12px; font-family:var(--font-mono);}

::-webkit-scrollbar{height:6px; width:6px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:99px;}
</style>
</head>
<body>

<header>
  <div class="hd-inner">
    <div class="hd-top">
      <h1>DSA Pattern Tracker</h1>
      <div class="hd-count"><b id="doneCount">0</b> / <span id="totalCount">0</span> solved</div>
    </div>
    <div class="bar"><div class="bar-fill" id="overallBar"></div></div>
    <div class="controls">
      <input class="search" id="search" type="text" placeholder="Search by name or number…" aria-label="Search problems">
      <button class="chip" data-diff="all" data-active="1">All</button>
      <button class="chip" data-diff="E">Easy</button>
      <button class="chip" data-diff="M">Medium</button>
      <button class="chip" data-diff="H">Hard</button>
    </div>
    <nav class="nav" id="navLinks"></nav>
  </div>
</header>

<div class="wrap" id="app"></div>

<footer>Progress is saved locally in this browser · <span id="repeatNote">🔁 = repeated problem, appears in an earlier phase too</span></footer>

<script>
(function(){
  const DATA = JSON.parse(document.getElementById('lc-data').textContent);
  const STORE_KEY = 'lc_tracker_solved_v1';
  let solved = new Set();
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) solved = new Set(JSON.parse(raw));
  }catch(e){}

  function persist(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify([...solved])); }catch(e){}
  }

  const app = document.getElementById('app');
  const nav = document.getElementById('navLinks');
  let activeDiff = 'all';
  let searchTerm = '';

  const allNums = new Set();
  DATA.forEach(p => p.phases.forEach(ph => ph.rows.forEach(r => allNums.add(r.n))));
  document.getElementById('totalCount').textContent = allNums.size;

  function diffLabel(d){ return d==='E' ? 'Easy' : d==='M' ? 'Medium' : 'Hard'; }

  function build(){
    app.innerHTML = '';
    nav.innerHTML = '';
    DATA.forEach(pattern => {
      const navA = document.createElement('a');
      navA.href = '#' + pattern.id;
      navA.textContent = pattern.title;
      nav.appendChild(navA);

      const section = document.createElement('section');
      section.className = 'pattern';
      section.id = pattern.id;

      const rowCount = pattern.phases.reduce((a,ph)=>a+ph.rows.length,0);
      section.innerHTML = `
        <div class="p-head">
          <h2 class="p-title">${pattern.title}</h2>
          <span class="p-sub">${rowCount} problems</span>
        </div>
        <div class="bar p-bar"><div class="bar-fill" data-pattern-bar="${pattern.id}"></div></div>
        <div class="p-actions">
          <button class="linklike" data-expand="${pattern.id}">expand all</button>
          <button class="linklike" data-collapse="${pattern.id}">collapse all</button>
        </div>
      `;

      pattern.phases.forEach((phase, idx) => {
        const phaseEl = document.createElement('div');
        phaseEl.className = 'phase';
        phaseEl.dataset.open = '0';
        phaseEl.dataset.pattern = pattern.id;

        const rowsHtml = phase.rows.map(r => rowHtml(r)).join('');

        phaseEl.innerHTML = `
          <div class="phase-hd" role="button" tabindex="0" aria-expanded="false">
            <div class="phase-hd-left">
              <span class="chevron">▶</span>
              <span class="phase-name">${phase.title}</span>
            </div>
            <div class="phase-meta">
              <span class="phase-count" data-phase-count>0/${phase.rows.length}</span>
              <div class="mini-bar"><div class="mini-fill" data-phase-bar></div></div>
            </div>
          </div>
          <div class="rows">${rowsHtml}</div>
        `;

        const hd = phaseEl.querySelector('.phase-hd');
        hd.addEventListener('click', () => toggle(phaseEl));
        hd.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(phaseEl); }});

        section.appendChild(phaseEl);
      });

      app.appendChild(section);

      section.querySelector(`[data-expand="${pattern.id}"]`).addEventListener('click', () => {
        section.querySelectorAll('.phase').forEach(p => { p.dataset.open='1'; p.querySelector('.phase-hd').setAttribute('aria-expanded','true'); });
      });
      section.querySelector(`[data-collapse="${pattern.id}"]`).addEventListener('click', () => {
        section.querySelectorAll('.phase').forEach(p => { p.dataset.open='0'; p.querySelector('.phase-hd').setAttribute('aria-expanded','false'); });
      });
    });

    app.querySelectorAll('.cb').forEach(cb => {
      cb.addEventListener('change', () => {
        const n = parseInt(cb.dataset.num, 10);
        if(cb.checked) solved.add(n); else solved.delete(n);
        persist();
        refreshRowsFor(n);
        updateAllProgress();
      });
    });

    updateAllProgress();
    applyFilters();
  }

  function rowHtml(r){
    const isDone = solved.has(r.n);
    const stars = r.st ? `<span class="stars" title="${r.st}/5 priority">${'★'.repeat(r.st)}</span>` : '';
    const repeat = r.r ? `<span class="repeat" title="Also appears in an earlier phase">🔁</span>` : '';
    const tags = (r.tg||[]).map(t=>`<span class="tag">${t}</span>`).join('');
    return `
      <div class="row ${isDone?'done':''}" data-num="${r.n}" data-diff="${r.d}" data-title="${r.t.toLowerCase()}">
        <input type="checkbox" class="cb" data-num="${r.n}" ${isDone?'checked':''} aria-label="Mark ${r.t} solved">
        <div class="row-body">
          <div class="row-line">
            <span class="dot ${r.d}"></span>
            <span class="row-num">#${r.n}</span>
            <span class="row-title"><a href="https://leetcode.com/problems/${r.s}/" target="_blank" rel="noopener">${r.t}</a></span>
          </div>
          <div class="row-meta">${tags}${stars}${repeat}</div>
        </div>
      </div>
    `;
  }

  function toggle(phaseEl){
    const open = phaseEl.dataset.open === '1';
    phaseEl.dataset.open = open ? '0' : '1';
    phaseEl.querySelector('.phase-hd').setAttribute('aria-expanded', String(!open));
  }

  function refreshRowsFor(num){
    document.querySelectorAll(`.row[data-num="${num}"]`).forEach(row => {
      const cb = row.querySelector('.cb');
      const isDone = solved.has(num);
      cb.checked = isDone;
      row.classList.toggle('done', isDone);
    });
  }

  function updateAllProgress(){
    let doneUnique = 0;
    allNums.forEach(n => { if(solved.has(n)) doneUnique++; });
    document.getElementById('doneCount').textContent = doneUnique;
    document.getElementById('overallBar').style.width = (allNums.size? (doneUnique/allNums.size*100):0) + '%';

    DATA.forEach(pattern => {
      const nums = new Set();
      pattern.phases.forEach(ph => ph.rows.forEach(r => nums.add(r.n)));
      let d = 0; nums.forEach(n => { if(solved.has(n)) d++; });
      const bar = document.querySelector(`[data-pattern-bar="${pattern.id}"]`);
      if(bar) bar.style.width = (nums.size? (d/nums.size*100):0) + '%';

      document.querySelectorAll(`.phase[data-pattern="${pattern.id}"]`).forEach((phaseEl, idx) => {
        const phase = pattern.phases[idx];
        let pd = 0;
        phase.rows.forEach(r => { if(solved.has(r.n)) pd++; });
        phaseEl.querySelector('[data-phase-count]').textContent = `${pd}/${phase.rows.length}`;
        phaseEl.querySelector('[data-phase-bar]').style.width = (phase.rows.length? (pd/phase.rows.length*100):0) + '%';
      });
    });
  }

  function applyFilters(){
    document.querySelectorAll('.row').forEach(row => {
      const d = row.dataset.diff;
      const title = row.dataset.title;
      const num = row.dataset.num;
      const diffOk = activeDiff==='all' || d===activeDiff;
      const searchOk = !searchTerm || title.includes(searchTerm) || num.includes(searchTerm);
      const hidden = !(diffOk && searchOk);
      row.dataset.hidden = hidden ? '1' : '0';
    });
    // auto-open phases that contain a visible match when searching
    if(searchTerm){
      document.querySelectorAll('.phase').forEach(ph => {
        const hasVisible = [...ph.querySelectorAll('.row')].some(r => r.dataset.hidden==='0');
        if(hasVisible){ ph.dataset.open='1'; }
      });
    }
  }

  document.getElementById('search').addEventListener('input', e => {
    searchTerm = e.target.value.trim().toLowerCase();
    applyFilters();
  });
  document.querySelectorAll('.chip[data-diff]').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chip[data-diff]').forEach(c => c.dataset.active='0');
      chip.dataset.active='1';
      activeDiff = chip.dataset.diff;
      applyFilters();
    });
  });

  build();
})();
</script>
</body>
</html>
