<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DSA Pattern Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F8FAFC;
  --surface: #FFFFFF;
  --surface-hover: #F1F5F9;
  --border: #E2E8F0;
  --border-hover: #CBD5E1;
  --text-primary: #0F172A;
  --text-secondary: #475569;
  --text-muted: #64748B;
  --accent: #2563EB;
  --accent-hover: #1D4ED8;
  --accent-soft: #EFF6FF;
  --easy: #059669;
  --easy-bg: #ECFDF5;
  --easy-border: #A7F3D0;
  --med: #D97706;
  --med-bg: #FFFBEB;
  --med-border: #FDE68A;
  --hard: #DC2626;
  --hard-bg: #FEF2F2;
  --hard-border: #FECACA;
  --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', monospace;
  --sidebar-width: 290px;
  --header-height: 58px;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-full: 9999px;
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.04);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
}

[data-theme="dark"] {
  --bg: #0B0F17;
  --surface: #131924;
  --surface-hover: #1E2536;
  --border: #263044;
  --border-hover: #334155;
  --text-primary: #F8FAFC;
  --text-secondary: #94A3B8;
  --text-muted: #64748B;
  --accent: #38BDF8;
  --accent-hover: #0284C7;
  --accent-soft: rgba(56, 189, 248, 0.12);
  --easy: #34D399;
  --easy-bg: rgba(52, 211, 153, 0.12);
  --easy-border: rgba(52, 211, 153, 0.25);
  --med: #FBBF24;
  --med-bg: rgba(251, 191, 36, 0.12);
  --med-border: rgba(251, 191, 36, 0.25);
  --hard: #F87171;
  --hard-bg: rgba(248, 113, 113, 0.12);
  --hard-border: rgba(248, 113, 113, 0.25);
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: 80px;
}

body {
  background: var(--bg);
  color: var(--text-primary);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  line-height: 1.5;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* Skip link */
.skip-link {
  position: absolute;
  top: -60px;
  left: 16px;
  background: var(--accent);
  color: #FFFFFF;
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  z-index: 1000;
  text-decoration: none;
  font-weight: 600;
  font-size: 13px;
  transition: top 0.2s ease;
}
.skip-link:focus {
  top: 12px;
}

/* App shell */
.app-shell {
  display: flex;
  min-height: 100vh;
  background: var(--bg);
}

.sidebar-backdrop {
  display: none;
}

.app-sidebar {
  width: var(--sidebar-width);
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  z-index: 40;
  transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

.main-workspace {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.mobile-topbar {
  display: none;
}

@media (max-width: 768px) {
  .app-shell {
    flex-direction: column;
  }
  .mobile-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: var(--header-height);
    padding: 0 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 30;
  }
  .app-sidebar {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: min(320px, 85vw);
    height: 100%;
    transform: translateX(-100%);
    box-shadow: var(--shadow-lg);
    z-index: 50;
  }
  .app-sidebar.open {
    transform: translateX(0);
  }
  .sidebar-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.45);
    backdrop-filter: blur(2px);
    z-index: 45;
  }
  .sidebar-backdrop.active {
    display: block;
  }
}

/* Sidebar styling */
.sidebar-header {
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--border);
}
.brand-row {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand-icon {
  font-size: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border-radius: var(--radius-md);
  background: var(--surface-hover);
  border: 1px solid var(--border);
}
.brand-text {
  flex: 1;
  min-width: 0;
}
.brand-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-primary);
  line-height: 1.2;
  letter-spacing: -0.01em;
}
.brand-sub {
  font-size: 11px;
  color: var(--text-muted);
  font-family: var(--font-mono);
}
.theme-toggle {
  background: var(--surface-hover);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  width: 34px;
  height: 34px;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.15s ease;
}
.theme-toggle:hover {
  background: var(--border);
  color: var(--text-primary);
}

.sidebar-stats {
  padding: 18px 20px;
  border-bottom: 1px solid var(--border);
}
.stat-main {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 8px;
}
.stat-metric {
  display: flex;
  flex-direction: column;
}
.stat-number {
  font-size: 22px;
  font-weight: 700;
  font-family: var(--font-mono);
  color: var(--text-primary);
  letter-spacing: -0.02em;
}
.stat-number small {
  font-size: 14px;
  color: var(--text-muted);
  font-weight: 500;
}
.stat-label {
  font-size: 11.5px;
  color: var(--text-muted);
  font-weight: 500;
}
.stat-percent {
  font-family: var(--font-mono);
  font-size: 15px;
  font-weight: 700;
  color: var(--accent);
}
.progress-bar-bg {
  height: 7px;
  background: var(--surface-hover);
  border-radius: var(--radius-full);
  overflow: hidden;
  border: 1px solid var(--border);
}
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), #38BDF8);
  width: 0%;
  border-radius: var(--radius-full);
  transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}

.stat-pills {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-top: 14px;
}
.stat-pill {
  padding: 7px 6px;
  border-radius: var(--radius-sm);
  display: flex;
  flex-direction: column;
  align-items: center;
  border: 1px solid var(--border);
  background: var(--surface-hover);
  text-align: center;
}
.pill-name {
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: 2px;
}
.pill-count {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
}
.pill-easy .pill-name { color: var(--easy); }
.pill-med .pill-name { color: var(--med); }
.pill-hard .pill-name { color: var(--hard); }

.sidebar-section {
  padding: 16px 20px 10px;
}
.section-title {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--text-muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.status-options {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.status-chip {
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-secondary);
  font-size: 13px;
  font-family: var(--font-sans);
  text-align: left;
  padding: 7px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: all 0.15s ease;
}
.status-chip:hover {
  background: var(--surface-hover);
  color: var(--text-primary);
}
.status-chip.active {
  background: var(--accent-soft);
  color: var(--accent);
  border-color: var(--accent);
  font-weight: 600;
}

.nav-section {
  flex: 1;
  overflow-y: auto;
  border-top: 1px solid var(--border);
  padding-bottom: 20px;
}
.pattern-nav {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.nav-pattern-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.nav-pattern-link {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-primary);
  text-decoration: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 8px;
  border-radius: var(--radius-sm);
  transition: background 0.15s ease;
}
.nav-pattern-link:hover {
  background: var(--surface-hover);
  color: var(--accent);
}
.nav-badge {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-muted);
  background: var(--surface-hover);
  padding: 1px 6px;
  border-radius: var(--radius-full);
  border: 1px solid var(--border);
}
.nav-phases-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding-left: 10px;
  margin-left: 6px;
  border-left: 1px solid var(--border);
}
.nav-phase-link {
  font-size: 11.5px;
  color: var(--text-muted);
  text-decoration: none;
  padding: 4px 6px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: all 0.12s ease;
}
.nav-phase-link:hover {
  color: var(--text-primary);
  background: var(--surface-hover);
}

.sidebar-footer {
  padding: 14px 20px;
  border-top: 1px solid var(--border);
  background: var(--surface);
  margin-top: auto;
}
.footer-actions {
  display: flex;
  gap: 6px;
  margin-bottom: 8px;
}
.tool-btn {
  flex: 1;
  background: var(--surface-hover);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  font-size: 11.5px;
  font-weight: 500;
  padding: 6px 8px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  transition: all 0.15s ease;
}
.tool-btn:hover {
  background: var(--border);
  color: var(--text-primary);
}
.btn-danger:hover {
  background: var(--hard-bg);
  color: var(--hard);
  border-color: var(--hard-border);
}
.footer-note {
  font-size: 11px;
  color: var(--text-muted);
  text-align: center;
  font-family: var(--font-mono);
}

/* Main workspace styling */
.workspace-header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 16px 28px;
}
.header-inner {
  max-width: 1040px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}
.search-container {
  position: relative;
  flex: 1;
  min-width: 240px;
}
.search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  pointer-events: none;
}
.search-input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-primary);
  border-radius: var(--radius-md);
  padding: 9px 38px 9px 36px;
  font-size: 13.5px;
  font-family: var(--font-sans);
  transition: all 0.15s ease;
  box-shadow: var(--shadow-sm);
}
.search-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.search-kbd {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: var(--surface-hover);
  border: 1px solid var(--border);
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: 4px;
}

.filter-controls {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.diff-chips {
  display: flex;
  gap: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 3px;
  border-radius: var(--radius-md);
}
.chip {
  background: transparent;
  border: none;
  color: var(--text-secondary);
  font-size: 12px;
  font-family: var(--font-sans);
  font-weight: 500;
  padding: 5px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.15s ease;
}
.chip:hover {
  color: var(--text-primary);
}
.chip.active {
  background: var(--accent);
  color: #FFFFFF;
  font-weight: 600;
}
.view-toggles {
  display: flex;
  gap: 6px;
}
.action-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 500;
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.15s ease;
}
.action-btn:hover {
  background: var(--surface-hover);
  color: var(--text-primary);
  border-color: var(--border-hover);
}

.curriculum-container {
  max-width: 1040px;
  width: 100%;
  margin: 0 auto;
  padding: 28px 28px 80px;
  display: flex;
  flex-direction: column;
  gap: 40px;
}

.empty-state {
  max-width: 480px;
  margin: 60px auto;
  text-align: center;
  padding: 32px 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
}
.empty-icon {
  font-size: 36px;
  margin-bottom: 12px;
}
.empty-state h3 {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 6px;
}
.empty-state p {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 16px;
}

/* Mobile topbar specifics */
.mobile-menu-btn {
  background: transparent;
  border: none;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 6px;
  cursor: pointer;
}
.mobile-brand {
  font-weight: 700;
  font-size: 15px;
}
.mobile-solved {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
}
</style>
</head>
<body>

<a href="#main-content" class="skip-link">Skip to problem list</a>

<div class="mobile-topbar">
  <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open navigation menu" aria-controls="app-sidebar" aria-expanded="false">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <div class="mobile-brand">DSA Pattern Tracker</div>
  <div class="mobile-solved" id="mobileSolvedBadge">0/110</div>
</div>

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<div class="app-shell">
  <aside class="app-sidebar" id="app-sidebar" aria-label="Navigation and statistics">
    <div class="sidebar-header">
      <div class="brand-row">
        <span class="brand-icon">🧩</span>
        <div class="brand-text">
          <h1 class="brand-title">DSA Tracker</h1>
          <span class="brand-sub">Pattern Roadmap</span>
        </div>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
          <span class="theme-icon" id="themeIcon">🌙</span>
        </button>
      </div>
    </div>

    <div class="sidebar-stats" id="statWidgets">
      <div class="stat-main">
        <div class="stat-metric">
          <span class="stat-number"><span id="doneCount">0</span><small>/<span id="totalCount">110</span></small></span>
          <span class="stat-label">Problems Solved</span>
        </div>
        <div class="stat-percent" id="percentLabel">0%</div>
      </div>
      <div class="progress-bar-bg" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" id="mainProgressBarAria">
        <div class="progress-bar-fill" id="overallBar"></div>
      </div>
      <div class="stat-pills">
        <div class="stat-pill pill-easy">
          <span class="pill-name">Easy</span>
          <span class="pill-count" id="easyCount">0/23</span>
        </div>
        <div class="stat-pill pill-med">
          <span class="pill-name">Med</span>
          <span class="pill-count" id="medCount">0/62</span>
        </div>
        <div class="stat-pill pill-hard">
          <span class="pill-name">Hard</span>
          <span class="pill-count" id="hardCount">0/25</span>
        </div>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="section-title">STATUS FILTER</div>
      <div class="status-options">
        <button class="status-chip active" data-status="all">All Problems</button>
        <button class="status-chip" data-status="solved">Solved Only</button>
        <button class="status-chip" data-status="unsolved">Unsolved Only</button>
        <button class="status-chip" data-status="starred">★ High Priority</button>
      </div>
    </div>

    <div class="sidebar-section nav-section">
      <div class="section-title">PATTERNS & PHASES</div>
      <nav class="pattern-nav" id="patternNav" aria-label="Patterns and phases"></nav>
    </div>

    <div class="sidebar-footer">
      <div class="footer-actions">
        <button class="tool-btn" id="exportBtn" title="Export progress as JSON">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          Export
        </button>
        <label class="tool-btn" id="importLabel" title="Import progress from JSON">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
          Import
          <input type="file" id="importInput" accept=".json" style="display:none">
        </label>
        <button class="tool-btn btn-danger" id="resetBtn" title="Reset all progress">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          Reset
        </button>
      </div>
      <div class="footer-note">Auto-saved locally in browser</div>
    </div>
  </aside>

  <main class="main-workspace" id="main-content">
    <header class="workspace-header">
      <div class="header-inner">
        <div class="search-container">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input class="search-input" id="search" type="search" placeholder="Search by problem name, #ID, or topic tag..." aria-label="Search problems">
          <kbd class="search-kbd" title="Press / to search">/</kbd>
        </div>
        <div class="filter-controls">
          <div class="diff-chips" role="radiogroup" aria-label="Difficulty filter">
            <button class="chip active" data-diff="all" role="radio" aria-checked="true">All</button>
            <button class="chip chip-e" data-diff="E" role="radio" aria-checked="false">Easy</button>
            <button class="chip chip-m" data-diff="M" role="radio" aria-checked="false">Medium</button>
            <button class="chip chip-h" data-diff="H" role="radio" aria-checked="false">Hard</button>
          </div>
          <div class="view-toggles">
            <button class="action-btn" id="expandAllBtn" title="Expand all phases">Expand All</button>
            <button class="action-btn" id="collapseAllBtn" title="Collapse all phases">Collapse All</button>
          </div>
        </div>
      </div>
    </header>

    <div class="curriculum-container" id="curriculumContainer"></div>

<script>
(function(){
  const DATA = JSON.parse(document.getElementById('lc-data').textContent);
  const STORE_KEY = 'lc_tracker_solved_v1';
  let solved = new Set();
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) solved = new Set(JSON.parse(raw));
  }catch(e){}

  function persist(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify([...solved])); }catch(e){}
  }

  const app = document.getElementById('app');
  const nav = document.getElementById('navLinks');
  let activeDiff = 'all';
  let searchTerm = '';

  const allNums = new Set();
  DATA.forEach(p => p.phases.forEach(ph => ph.rows.forEach(r => allNums.add(r.n))));
  document.getElementById('totalCount').textContent = allNums.size;

  function diffLabel(d){ return d==='E' ? 'Easy' : d==='M' ? 'Medium' : 'Hard'; }

  function build(){
    app.innerHTML = '';
    nav.innerHTML = '';
    DATA.forEach(pattern => {
      const navA = document.createElement('a');
      navA.href = '#' + pattern.id;
      navA.textContent = pattern.title;
      nav.appendChild(navA);

      const section = document.createElement('section');
      section.className = 'pattern';
      section.id = pattern.id;

      const rowCount = pattern.phases.reduce((a,ph)=>a+ph.rows.length,0);
      section.innerHTML = `
        <div class="p-head">
          <h2 class="p-title">${pattern.title}</h2>
          <span class="p-sub">${rowCount} problems</span>
        </div>
        <div class="bar p-bar"><div class="bar-fill" data-pattern-bar="${pattern.id}"></div></div>
        <div class="p-actions">
          <button class="linklike" data-expand="${pattern.id}">expand all</button>
          <button class="linklike" data-collapse="${pattern.id}">collapse all</button>
        </div>
      `;

      pattern.phases.forEach((phase, idx) => {
        const phaseEl = document.createElement('div');
        phaseEl.className = 'phase';
        phaseEl.dataset.open = '0';
        phaseEl.dataset.pattern = pattern.id;

        const rowsHtml = phase.rows.map(r => rowHtml(r)).join('');

        phaseEl.innerHTML = `
          <div class="phase-hd" role="button" tabindex="0" aria-expanded="false">
            <div class="phase-hd-left">
              <span class="chevron">▶</span>
              <span class="phase-name">${phase.title}</span>
            </div>
            <div class="phase-meta">
              <span class="phase-count" data-phase-count>0/${phase.rows.length}</span>
              <div class="mini-bar"><div class="mini-fill" data-phase-bar></div></div>
            </div>
          </div>
          <div class="rows">${rowsHtml}</div>
        `;

        const hd = phaseEl.querySelector('.phase-hd');
        hd.addEventListener('click', () => toggle(phaseEl));
        hd.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(phaseEl); }});

        section.appendChild(phaseEl);
      });

      app.appendChild(section);

      section.querySelector(`[data-expand="${pattern.id}"]`).addEventListener('click', () => {
        section.querySelectorAll('.phase').forEach(p => { p.dataset.open='1'; p.querySelector('.phase-hd').setAttribute('aria-expanded','true'); });
      });
      section.querySelector(`[data-collapse="${pattern.id}"]`).addEventListener('click', () => {
        section.querySelectorAll('.phase').forEach(p => { p.dataset.open='0'; p.querySelector('.phase-hd').setAttribute('aria-expanded','false'); });
      });
    });

    app.querySelectorAll('.cb').forEach(cb => {
      cb.addEventListener('change', () => {
        const n = parseInt(cb.dataset.num, 10);
        if(cb.checked) solved.add(n); else solved.delete(n);
        persist();
        refreshRowsFor(n);
        updateAllProgress();
      });
    });

    updateAllProgress();
    applyFilters();
  }

  function rowHtml(r){
    const isDone = solved.has(r.n);
    const stars = r.st ? `<span class="stars" title="${r.st}/5 priority">${'★'.repeat(r.st)}</span>` : '';
    const repeat = r.r ? `<span class="repeat" title="Also appears in an earlier phase">🔁</span>` : '';
    const tags = (r.tg||[]).map(t=>`<span class="tag">${t}</span>`).join('');
    return `
      <div class="row ${isDone?'done':''}" data-num="${r.n}" data-diff="${r.d}" data-title="${r.t.toLowerCase()}">
        <input type="checkbox" class="cb" data-num="${r.n}" ${isDone?'checked':''} aria-label="Mark ${r.t} solved">
        <div class="row-body">
          <div class="row-line">
            <span class="dot ${r.d}"></span>
            <span class="row-num">#${r.n}</span>
            <span class="row-title"><a href="https://leetcode.com/problems/${r.s}/" target="_blank" rel="noopener">${r.t}</a></span>
          </div>
          <div class="row-meta">${tags}${stars}${repeat}</div>
        </div>
      </div>
    `;
  }

  function toggle(phaseEl){
    const open = phaseEl.dataset.open === '1';
    phaseEl.dataset.open = open ? '0' : '1';
    phaseEl.querySelector('.phase-hd').setAttribute('aria-expanded', String(!open));
  }

  function refreshRowsFor(num){
    document.querySelectorAll(`.row[data-num="${num}"]`).forEach(row => {
      const cb = row.querySelector('.cb');
      const isDone = solved.has(num);
      cb.checked = isDone;
      row.classList.toggle('done', isDone);
    });
  }

  function updateAllProgress(){
    let doneUnique = 0;
    allNums.forEach(n => { if(solved.has(n)) doneUnique++; });
    document.getElementById('doneCount').textContent = doneUnique;
    document.getElementById('overallBar').style.width = (allNums.size? (doneUnique/allNums.size*100):0) + '%';

    DATA.forEach(pattern => {
      const nums = new Set();
      pattern.phases.forEach(ph => ph.rows.forEach(r => nums.add(r.n)));
      let d = 0; nums.forEach(n => { if(solved.has(n)) d++; });
      const bar = document.querySelector(`[data-pattern-bar="${pattern.id}"]`);
      if(bar) bar.style.width = (nums.size? (d/nums.size*100):0) + '%';

      document.querySelectorAll(`.phase[data-pattern="${pattern.id}"]`).forEach((phaseEl, idx) => {
        const phase = pattern.phases[idx];
        let pd = 0;
        phase.rows.forEach(r => { if(solved.has(r.n)) pd++; });
        phaseEl.querySelector('[data-phase-count]').textContent = `${pd}/${phase.rows.length}`;
        phaseEl.querySelector('[data-phase-bar]').style.width = (phase.rows.length? (pd/phase.rows.length*100):0) + '%';
      });
    });
  }

  function applyFilters(){
    document.querySelectorAll('.row').forEach(row => {
      const d = row.dataset.diff;
      const title = row.dataset.title;
      const num = row.dataset.num;
      const diffOk = activeDiff==='all' || d===activeDiff;
      const searchOk = !searchTerm || title.includes(searchTerm) || num.includes(searchTerm);
      const hidden = !(diffOk && searchOk);
      row.dataset.hidden = hidden ? '1' : '0';
    });
    // auto-open phases that contain a visible match when searching
    if(searchTerm){
      document.querySelectorAll('.phase').forEach(ph => {
        const hasVisible = [...ph.querySelectorAll('.row')].some(r => r.dataset.hidden==='0');
        if(hasVisible){ ph.dataset.open='1'; }
      });
    }
  }

  document.getElementById('search').addEventListener('input', e => {
    searchTerm = e.target.value.trim().toLowerCase();
    applyFilters();
  });
  document.querySelectorAll('.chip[data-diff]').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chip[data-diff]').forEach(c => c.dataset.active='0');
      chip.dataset.active='1';
      activeDiff = chip.dataset.diff;
      applyFilters();
    });
  });

  build();
})();
</script>
</body>
</html>
